{% extends "portal/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Сохранить</button>
  </form>
  <p><a href="{% url 'portal:index' %}">← в кабинет</a></p>
{% endblock %}
