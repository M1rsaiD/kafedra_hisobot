<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Кабинет преподавателя{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; color: #222; padding: 0 16px; }
    a { color: #1a5fb4; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #ddd; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
    .card a.button, a.button, button.button {
      display: inline-block; padding: 6px 14px; background: #1a5fb4; color: #fff;
      text-decoration: none; border-radius: 6px; font-size: 14px; border: none; cursor: pointer;
    }
    .muted { color: #777; font-size: 13px; }
    .messages { list-style: none; padding: 0; }
    .messages li { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
    .messages .success { background: #e3f6e8; color: #1a7a3c; }
    .messages .error { background: #fbe6e6; color: #a12626; }
    .messages .warning { background: #fff4d9; color: #8a5b00; }
    .messages .info { background: #e8f0fb; color: #1a5fb4; }
    form p { margin: 10px 0; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 3px; }
    input, select, textarea {
      width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
      box-sizing: border-box;
    }
    nav { margin-bottom: 20px; font-size: 14px; }
    nav a { margin-right: 14px; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'portal:index' %}">Кабинет</a>
    <a href="{% url 'portal:profile' %}">Мой профиль</a>
    {% if request.user.is_authenticated %}<span class="muted">{{ request.user.username }}</span>{% endif %}
  </nav>

  {% if messages %}
  <ul class="messages">
    {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
